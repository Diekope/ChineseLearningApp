name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "ci/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  audit:
    name: Security and functionality audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run security audit
        run: npm run audit:security

      - name: Run functional audit
        run: npm run audit:functional

      - name: Verify Python server syntax
        run: python3 -m py_compile serve.py
